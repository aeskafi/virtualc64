<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
<title>VirtualC64 Hardware Core</title>
<style type="text/css">
body {
    margin: 0;
    background-color: black;
    overflow: hidden;
}
.game {
    position: absolute;
    top: 0px;
    left: 0px;
    margin: 0px;
    border: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: block;
    image-rendering: optimizeSpeed;
    image-rendering: -moz-crisp-edges;
    image-rendering: -o-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    -ms-interpolation-mode: nearest-neighbor;
}
</style>
</head>
<body>
  <div style="position:fixed;top:10px;right:10px;z-index:999;display:flex;gap:8px;">
    <input type="file" id="standaloneFileInput" onchange="if(this.files[0])window.loadC64File(this.files[0])" accept=".d64,.prg,.tap,.t64" style="display:none">
    <button onclick="document.getElementById('standaloneFileInput').click()" style="background:#0f172a;color:#38bdf8;border:1px solid #334155;padding:6px 12px;font-family:monospace;font-size:11px;font-weight:bold;border-radius:8px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,0.4);display:flex;align-items:center;gap:6px;">
      <span>💾 INSERT DISK / FILE (.D64 / .PRG / .TAP)</span>
    </button>
  </div>
  <canvas class="game" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <script type="text/javascript" src="c64_wasm_data.js"></script>
  <script type="text/javascript">
    var Module = {
        preRun: [],
        instantiateWasm: function(imports, successCallback) {
          if (typeof C64_WASM_BASE64 !== 'undefined' && C64_WASM_BASE64) {
            try {
              var raw = atob(C64_WASM_BASE64);
              var bytes = new Uint8Array(raw.length);
              for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
              WebAssembly.instantiate(bytes, imports).then(function(output) {
                successCallback(output.instance);
              }).catch(function(err) {
                console.error('WASM instantiation failed:', err);
              });
              return {}; // Asynchronous instantiation signal for Emscripten
            } catch (e) {
              console.warn('Inline WASM decode warning, falling back:', e);
            }
          }
          return false; // Fallback to fetch
        },
        print: (function() {
            return function(text) {
                text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            };
        })(),
        printErr: function(text) {
            text = Array.prototype.slice.call(arguments).join(' ');
            console.error(text);
        },
    };
    window.onerror = function(event) {
        console.log("onerror: " + event);
    };

    // Bridge for parent window to load Commodore 64 files (.d64, .prg, .tap, .t64)
    window.loadC64File = function(file) {
      try {
        var dt = new DataTransfer();
        dt.items.add(file);
        var dropEvent = new DragEvent('drop', {
          dataTransfer: dt,
          bubbles: true,
          cancelable: true
        });
        var canvas = document.getElementById('canvas');
        canvas.dispatchEvent(dropEvent);
        return true;
      } catch (err) {
        console.error('Failed to dispatch dropEvent:', err);
        return false;
      }
    };

    window.loadC64Bytes = function(bytes, filename) {
      try {
        var blob = new Blob([bytes], { type: 'application/octet-stream' });
        var file = new File([blob], filename || 'game.prg', { type: 'application/octet-stream' });
        return window.loadC64File(file);
      } catch (err) {
        console.error('Failed to create File from bytes:', err);
        return false;
      }
    };

    window.addEventListener('message', function(event) {
      if (!event.data) return;
      if (event.data.type === 'LOAD_C64_FILE' && event.data.bytes) {
        window.loadC64Bytes(event.data.bytes, event.data.name);
      }
    });
  </script>
  <script async type="text/javascript" src="c64.js"></script>
</body>
</html>
